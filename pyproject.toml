[build-system]
requires = ["uv_build>=0.9.16,<0.10.0"]
build-backend = "uv_build"

[project]
name = "rpa-web-scraping-exercise"
version = "0.1.0"
description = "Web scraping exercise for candidates to a junior RPA developer position"
readme = "README.md"
requires-python = ">=3.13"
dependencies = ["playwright>=1.63.0"]

[project.scripts]
scrape-books = "rpa_web_scraping_exercise.main:main"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-playwright>=0.9.0",
]
